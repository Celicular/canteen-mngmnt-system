version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen_backend
    ports:
      - "21396:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  sqlite_data:
